    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07080a"/><stop offset=".62" stop-color="#121416"/><stop offset="1" stop-color="#1a1c1e"/></linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#1a120c"/><stop offset=".5" stop-color="#3a2c22"/><stop offset="1" stop-color="#5a4636"/></linearGradient>
