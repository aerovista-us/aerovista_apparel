<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="AeroVista Apparel boutique interior">
  <defs>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080a0d"/><stop offset="1" stop-color="#15171a"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a1c20"/><stop offset=".55" stop-color="#111317"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07090c"/><stop offset=".62" stop-color="#17191c"/><stop offset="1" stop-color="#222326"/></linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#07090c"/><stop offset=".62" stop-color="#17191c"/><stop offset="1" stop-color="#222326"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34312d"/><stop offset=".26" stop-color="#242321"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#15191e"/><stop offset="1" stop-color="#050608"/></linearGradient>
    <radialGradient id="warm" cx="50%" cy="19%" r="72%"><stop stop-color="#b8915e" stop-opacity=".18"/><stop offset=".55" stop-color="#7c6041" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%"><stop stop-color="#d6b07d" stop-opacity=".14"/><stop offset="1" stop-color="#d6b07d" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a3036" stop-opacity=".38"/><stop offset=".45" stop-color="#11161b" stop-opacity=".18"/><stop offset="1" stop-color="#65717a" stop-opacity=".08"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="17" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter>
  </defs>

  <rect width="1672" height="941" fill="#06080b"/>

  <!-- architectural shell -->
  <polygon points="0,0 515,145 1157,145 1672,0" fill="url(#ceiling)"/>
  <polygon points="0,0 515,145 515,610 0,941" fill="url(#wallL)"/>
  <polygon points="1672,0 1157,145 1157,610 1672,941" fill="url(#wallR)"/>
  <rect x="515" y="145" width="642" height="465" fill="url(#back)"/>
  <polygon points="0,941 515,610 1157,610 1672,941" fill="url(#floor)"/>
  <rect width="1672" height="941" fill="url(#warm)"/>

  <!-- ceiling coffers / depth -->
  <g fill="none" stroke="#25292d" stroke-width="2" opacity=".9">
    <path d="M242 42 L566 169 H1106 L1430 42"/>
    <path d="M394 14 L620 128 H1052 L1278 14"/>
    <path d="M570 0 L677 90 H995 L1102 0"/>
  </g>
  <g stroke="#9a8a73" stroke-width="3" opacity=".48">
    <line x1="548" y1="104" x2="1124" y2="104"/>
    <line x1="603" y1="71" x2="1069" y2="71"/>
  </g>
  <g fill="#f0d1a7" opacity=".72" filter="url(#glow)">
    <circle cx="635" cy="104" r="3.5"/><circle cx="735" cy="104" r="3.5"/><circle cx="836" cy="104" r="3.5"/><circle cx="937" cy="104" r="3.5"/><circle cx="1037" cy="104" r="3.5"/>
  </g>

  <!-- side wall panel rhythm -->
  <g stroke="#2d3033" stroke-width="2" opacity=".75">
    <line x1="88" y1="98" x2="88" y2="884"/><line x1="207" y1="126" x2="207" y2="807"/><line x1="328" y1="158" x2="328" y2="730"/><line x1="446" y1="193" x2="446" y2="651"/>
    <line x1="1584" y1="98" x2="1584" y2="884"/><line x1="1465" y1="126" x2="1465" y2="807"/><line x1="1344" y1="158" x2="1344" y2="730"/><line x1="1226" y1="193" x2="1226" y2="651"/>
  </g>

  <!-- perspective-calibrated merchandise wall bays. Every horizontal feature
       is derived from the same side-wall plane, so rails converge with the room. -->
  <g opacity=".92">
    <polygon points="72,283 468,284 468,518 72,685" fill="#0d1013" stroke="#33383d" stroke-width="2"/>
    <polygon points="1204,284 1600,283 1600,685 1204,518" fill="#0d1013" stroke="#33383d" stroke-width="2"/>
    <polygon points="92,317 449,305 449,505 92,642" fill="url(#glass)"/>
    <polygon points="1223,305 1580,317 1580,642 1223,505" fill="url(#glass)"/>
  </g>
  <g stroke="#8d8478" stroke-width="3" opacity=".58">
    <line x1="116" y1="407" x2="436" y2="358"/><line x1="1236" y1="358" x2="1556" y2="407"/>
    <line x1="132" y1="582" x2="432" y2="478"/><line x1="1240" y1="478" x2="1540" y2="582"/>
  </g>

  <!-- back wall architecture: depth beyond the current room -->
  <g>
    <rect x="560" y="188" width="552" height="385" rx="2" fill="#0d1013" stroke="#2a3035" stroke-width="2"/>
    <rect x="588" y="216" width="178" height="318" fill="url(#portal)" stroke="#333a40" stroke-width="2"/>
    <rect x="906" y="216" width="178" height="318" fill="url(#portal)" stroke="#333a40" stroke-width="2"/>
    <polygon points="611,239 743,239 724,510 630,510" fill="#080a0d" stroke="#22282e"/>
    <polygon points="929,239 1061,239 1042,510 948,510" fill="#080a0d" stroke="#22282e"/>
    <text x="677" y="205" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="10" letter-spacing="4" fill="#7e8991">STUDIO</text>
    <text x="995" y="205" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="10" letter-spacing="4" fill="#7e8991">ARCHIVE</text>
  </g>

  <!-- center Apex signature, restrained -->
  <g transform="translate(836 316)" fill="none" stroke-linejoin="round">
    <path d="M-62 66 L0 -31 L62 66" stroke="#c8cbd0" stroke-width="8" opacity=".72"/>
    <path d="M-36 66 L0 12 L36 66" stroke="#4d555c" stroke-width="5"/>
    <line x1="-47" y1="45" x2="47" y2="45" stroke="#00aeef" stroke-width="2" opacity=".7" filter="url(#glow)"/>
  </g>
  <text x="836" y="425" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="11" letter-spacing="6" fill="#858f97">AEROVISTA</text>
  <text x="836" y="450" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="7" letter-spacing="3" fill="#59636b">SEVEN DIVISIONS · ONE VISION</text>

  <!-- floor perspective and material -->
  <g stroke="#353638" stroke-width="2" opacity=".7">
    <line x1="836" y1="610" x2="836" y2="941"/>
    <line x1="724" y1="610" x2="595" y2="941"/><line x1="948" y1="610" x2="1077" y2="941"/>
    <line x1="612" y1="610" x2="354" y2="941"/><line x1="1060" y1="610" x2="1318" y2="941"/>
    <line x1="515" y1="668" x2="1157" y2="668"/><line x1="424" y1="744" x2="1248" y2="744"/><line x1="309" y1="839" x2="1363" y2="839"/>
  </g>
  <path d="M818 610 L790 941 H882 L854 610Z" fill="#00aeef" opacity=".025"/>
  <line x1="836" y1="610" x2="836" y2="941" stroke="#00aeef" stroke-width="1.5" opacity=".28" filter="url(#glow)"/>

  <!-- pools of gallery light -->
  <ellipse cx="315" cy="664" rx="265" ry="122" fill="url(#pool)" transform="rotate(-7 315 664)"/>
  <ellipse cx="1357" cy="664" rx="265" ry="122" fill="url(#pool)" transform="rotate(7 1357 664)"/>
  <ellipse cx="836" cy="691" rx="215" ry="83" fill="url(#pool)" opacity=".65"/>

  <!-- central object plinth -->
  <g fill="#0c0f12" stroke="#4d5358" stroke-width="2">
    <polygon points="696,640 976,640 1042,704 630,704"/>
    <polygon points="650,704 1022,704 995,812 677,812"/>
  </g>
  <path d="M685 657 H987" stroke="#a7adb1" stroke-width="1" opacity=".32"/>
  <rect x="760" y="609" width="152" height="34" rx="3" fill="#181c20" opacity=".9"/>

  <!-- faint glass reflections / air -->
  <path d="M113 274 L360 318 L222 610" fill="#fff" opacity=".012"/>
  <path d="M1559 274 L1312 318 L1450 610" fill="#fff" opacity=".012"/>
  <rect width="1672" height="941" filter="url(#grain)" opacity=".65"/>
</svg>
